name: Nueva versión del modelo
# =====================================================================================================================
# QUÉ HACE  (a mano: Actions > «Nueva versión del modelo» > Run workflow)
#
#   Lleva una versión nueva del modelo «retencion-90d» a producción de punta a punta, con una puerta de calidad, una
#   aprobación humana y un rastro que se puede revisar y deshacer. «Producción» son dos cosas que van juntas:
#     * la IMAGEN de la API en GitHub Container Registry:  ghcr.io/<propietario>/retencion-api:v<N>-<huella de datos>
#     * la FICHA de esa imagen en el repositorio:          04-Proyecto-Base/models/referencia.json
#   Los trabajos, en orden (cada uno necesita que el anterior haya ido bien):
#
#     entrenar ──► construir-y-probar ──► publicar ──► referencia
#
#   1) entrenar            Corre el pipeline con la fuente de datos pedida y COMPARA con models/referencia.json
#                          (`python -m ia_mlops.produccion comparar`). La decisión es una de tres:
#                            igual      los datos tienen la misma huella que la versión en producción: nada que publicar.
#                                       El resto de trabajos se OMITEN (aparecen en gris) y el resumen lo explica.
#                            rechazada  el AUC de test empeora MÁS que la tolerancia: el trabajo FALLA (rojo) con el motivo
#                                       y no se construye ni se publica nada.
#                            aceptada   pasa a los trabajos siguientes.
#   2) construir-y-probar  Construye la imagen con el modelo nuevo, la prueba (/salud, /listo, /modelo y una predicción) y
#                          compara CAMPEÓN y CANDIDATA: cuántos clientes cambian de tramo (alta / media / baja) entre la
#                          versión en producción y la nueva, puntuando las MISMAS filas de los mismos cortes de test.
#   3) publicar            ESPERA LA APROBACIÓN de una persona (environment «produccion»). Aprobada, sube la imagen ya
#                          probada a GHCR con la etiqueta v<N+1>-<huella>. Es el único trabajo con permiso «packages: write».
#   4) referencia          Abre un PULL REQUEST (rama «referencia/v<N+1>-<n.º de ejecución>») que actualiza
#                          04-Proyecto-Base/models/referencia.json con `python -m ia_mlops.produccion crear` y el historial
#                          models/historial_versiones.json (`... produccion historial`: la nueva «produccion», la anterior
#                          «anterior»; es lo que enseña la pestaña «Versiones» del panel). NUNCA hace push a
#                          develop ni a main: la nueva versión pasa a ser «la de producción» cuando una persona FUSIONA el PR.
#
#   Entradas:
#     fuente      muestra  = el CSV pequeño del repositorio (150 clientes). Es la misma fuente de la versión 1: sale «igual».
#                 completo = el Excel original de UCI (Online Retail II, licencia CC BY 4.0; ~1,07 millones de líneas).
#                            Se DESCARGA en el propio trabajo con `python -m ia_mlops.dataset descargar` (comprueba el sha256)
#                            y se guarda en la caché de Actions; el Excel NO está en el repositorio (está en .gitignore).
#                            Es lo que simula «llegan datos nuevos»: más clientes, y otro modelo.
#     tolerancia  cuánto puede EMPEORAR el AUC de test (diferencia absoluta). Vacía = config.TOLERANCIA_COMPARACION (0,02).
#                 Un valor NEGATIVO es una exigencia: -0.10 = «la versión nueva debe MEJORAR al menos 0,10». Sirve para ensayar el
#                 rechazo con datos reales, porque con el Excel completo el modelo nuevo no empeora (en la comprobación local
#                 el AUC de test pasó de 0,7471 a 0,7956: no se ha verificado todavía en Actions). Con la tolerancia
#                 por defecto esa versión sale «aceptada»; con -0.10 sale «rechazada».
#
#   CÓMO SE COMPARA CAMPEÓN Y CANDIDATA (decisión de diseño, la más simple y fiable de las tres posibles):
#     a) bajar la imagen anterior de GHCR: falla en la primera vez (la v1 no se ha publicado nunca) y en un fork privado;
#     b) guardar las predicciones de la versión anterior: añade un archivo que hay que mantener y que se queda viejo;
#     c) REENTRENAR la versión de referencia desde el código y la fuente actuales (la que anota referencia.json) en una
#        carpeta aparte, y comprobar que su huella de datos coincide con la de referencia.json.   <- esta
#     Se usa (c): no depende de nada publicado y es determinista (los datos y las semillas son fijos). Es una RECONSTRUCCIÓN
#     de la versión de referencia con el código de hoy, no el archivo exacto que se publicó; si la huella no coincide, el
#     trabajo lo avisa y se salta solo esta comparación (la puerta del AUC y la publicación no dependen de ella).
#
#   Además de la puerta del AUC (la que decide), el resumen enseña el AUC de las DOS versiones sobre las mismas filas de
#   test de la candidata: es la comparación justa cuando cambian los datos (la de la ficha se midió con los datos antiguos).
#
# ROLLBACK (volver a la versión anterior)
#   La versión «en producción» es la que dice models/referencia.json en la rama base, y las imágenes anteriores siguen en GHCR:
#   volver atrás es devolver la ficha a la versión anterior. Dos formas:
#     * Actions > «Rollback de la versión del modelo» (rollback.yml, en esta misma carpeta): abre un PR que restaura
#       models/referencia.json de la versión que se pida (por defecto, la anterior a la actual) y marca en el historial
#       la restaurada como «produccion» y la que se deja como «retirada». Al fusionarlo, el siguiente lote vuelve a usar
#       la imagen anterior.
#     * O a mano: «Revert» del PR de referencia que se fusionó (botón del propio PR).
#   Nada se borra: ni imágenes ni historial. Volver a avanzar es lanzar este workflow otra vez.
#
# QUÉ CONFIGURA QUIEN ADMINISTRA EL REPOSITORIO (una vez; ver CONFIGURAR-REPOSITORIO.md)
#   - environment «produccion» con revisores (si no, la publicación no esperaría a nadie);
#   - permiso de Actions para crear pull requests;
#   - visibilidad del paquete retencion-api en GHCR.
#
# CÓMO USAR ESTE ARCHIVO
#   Cópialo a  .github/workflows/nueva-version.yml  de TU repositorio. Está escrito para el repositorio del curso, donde el
#   proyecto vive en 04-Proyecto-Base. Si la raíz de tu repositorio es la carpeta del proyecto (la que tiene Makefile y
#   deploy/), cambia  working-directory: 04-Proyecto-Base  por  working-directory: .  y quita el prefijo «04-Proyecto-Base/»
#   de las rutas de los pasos «cache», «upload-artifact» y «download-artifact», y de los dos «cache-dependency-path».
#
# SIN SECRETOS PROPIOS: solo se usa el GITHUB_TOKEN que GitHub crea en cada ejecución, con los permisos mínimos de cada trabajo.
# Las cifras salen de la ejecución (la decisión, las métricas, los cambios de tramo): ninguna está escrita a mano aquí.
# Las versiones de las acciones checkout@v4, setup-python@v5 y upload/download-artifact@v4 y la publicación en GHCR con el
# GITHUB_TOKEN y el PR de la referencia se ejecutaron en el taller el 14/11/2026. SIN VERIFICAR en Actions: este workflow
# entero (aún no se ha ejecutado) y actions/cache@v4, que aquí se usa por primera vez.
# =====================================================================================================================
on:
  workflow_dispatch:
    inputs:
      fuente:
        description: "Datos con los que entrenar: muestra (CSV del repositorio, la fuente de la versión 1) o completo (Excel de UCI, se descarga)"
        type: choice
        options:
          - muestra
          - completo
        default: muestra
      tolerancia:
        description: "Cuánto puede empeorar el AUC de test frente a la versión en producción (vacío = la de config.py, 0.02). Negativo = exigencia de mejora: -0.10 rechaza una versión que no mejore 0.10"
        type: string
        required: false
        default: ""

# Lo mínimo para todo el workflow; cada trabajo declara abajo los suyos (y solo los que necesita).
permissions:
  contents: read

# Una sola versión nueva a la vez; la segunda espera, no cancela a la primera (que puede estar esperando aprobación).
concurrency:
  group: nueva-version-modelo
  cancel-in-progress: false

env:
  CURSO_SIN_PANTALLA: "1"           # matplotlib sin ventana

defaults:
  run:
    shell: bash                     # bash con -e y pipefail: un fallo dentro de una tubería (orden | tee) también rompe el paso
    working-directory: 04-Proyecto-Base    # carpeta del proyecto dentro del repositorio (ver «CÓMO USAR ESTE ARCHIVO»)

jobs:
  # ===================================================================================================================
  entrenar:
    name: "1 · Entrenar y comparar con la versión en producción"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      decision: ${{ steps.comparar.outputs.decision }}                       # igual | aceptada | rechazada
      version_referencia: ${{ steps.comparar.outputs.version_referencia }}   # la que está en producción
      version_nueva: ${{ steps.comparar.outputs.version_nueva }}             # la que se publicaría (N+1)
      huella: ${{ steps.comparar.outputs.huella }}                           # huella de los datos de la candidata
      etiqueta: ${{ steps.comparar.outputs.etiqueta }}                       # v<N+1>-<huella>
      fuente_referencia: ${{ steps.comparar.outputs.fuente_referencia }}     # fuente con la que se entrenó la versión en producción
    env:
      FUENTE: ${{ inputs.fuente }}
      TOLERANCIA_ENTRADA: ${{ inputs.tolerancia }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: 04-Proyecto-Base/requirements-dev.txt

      - name: Instalar dependencias fijadas
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e . --no-deps

      - name: Comprobar las entradas
        run: |
          case "$FUENTE" in
            muestra|completo) echo "fuente = $FUENTE" ;;
            *) echo "::error title=Entrada no válida::fuente debe ser muestra o completo (recibido: $FUENTE)"; exit 1 ;;
          esac
          if [ -n "$TOLERANCIA_ENTRADA" ]; then
            valida=0
            python -c 'import sys; v = float(sys.argv[1]); assert -1 <= v <= 1' "$TOLERANCIA_ENTRADA" 2> /dev/null || valida=1
            if [ "$valida" = "1" ]; then
              echo "::error title=Entrada no válida::tolerancia debe ser un número entre -1 y 1 (recibido: $TOLERANCIA_ENTRADA)"
              exit 1
            fi
            echo "::notice title=Tolerancia::Se usa la tolerancia pedida a mano ($TOLERANCIA_ENTRADA), no la de config.py"
          fi

      # El Excel de UCI no está en el repositorio. Se guarda en la caché de Actions para no bajarlo (~45 MB) en cada ejecución.
      # La clave lleva el principio del sha256 del zip que espera config.SHA256_ZIP_UCI (una prueba comprueba que coinciden).
      - name: Datos completos · restaurar de la caché
        if: inputs.fuente == 'completo'
        uses: actions/cache@v4
        with:
          path: 04-Proyecto-Base/data/raw/online_retail_ii
          key: uci-online-retail-ii-572e36277c23

      - name: Datos completos · descargar de UCI si no estaban en la caché (verifica el sha256)
        if: inputs.fuente == 'completo'
        run: python -m ia_mlops.dataset descargar

      - name: Entrenar (pipeline completo con la fuente pedida)
        run: |
          mkdir -p /tmp/s
          python -m ia_mlops.pipeline --fuente "$FUENTE" | tee /tmp/pipeline.txt

      - name: Comparar con models/referencia.json (la puerta de calidad)
        id: comparar
        run: |
          args=(--json decision.json)
          if [ -n "$TOLERANCIA_ENTRADA" ]; then args+=(--tolerancia "$TOLERANCIA_ENTRADA"); fi
          codigo=0
          python -m ia_mlops.produccion comparar "${args[@]}" > /tmp/comparar.txt 2>&1 || codigo=$?
          cat /tmp/comparar.txt
          # Código de salida de `comparar`: 0 igual o aceptada · 1 rechazada · 2 no se pudo comparar
          if [ "$codigo" = "2" ]; then
            echo "::error title=No se pudo comparar::$(tail -n 1 /tmp/comparar.txt)"
            exit 1
          fi
          python - <<'FIN' >> "$GITHUB_OUTPUT"
          import json
          d = json.load(open('decision.json', encoding='utf-8'))
          nueva = d['version_referencia'] + 1
          print('decision=' + d['decision'])
          print(f"version_referencia={d['version_referencia']}")
          print(f'version_nueva={nueva}')
          print(f"huella={d['huella_candidata']}")
          print(f"etiqueta=v{nueva}-{d['huella_candidata']}")
          print(f"fuente_referencia={d['fuente_referencia']}")
          FIN
          cat "$GITHUB_OUTPUT"

      # El resumen se escribe SIEMPRE (también si se rechaza): es lo primero que lee quien abre la ejecución.
      - name: Resumen de la ejecución
        if: always() && steps.comparar.outputs.decision != ''
        run: |
          python - <<'FIN' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          d = json.load(open('decision.json', encoding='utf-8'))
          titulo = {'igual': 'IGUAL · nada que publicar', 'aceptada': 'ACEPTADA · pasa a construir y a la aprobación',
                    'rechazada': 'RECHAZADA · no se publica'}[d['decision']]
          print(f"## Nueva versión del modelo · {titulo}\n")
          print(f"{d['motivo']}\n")
          print(f"Datos: fuente **{os.environ['FUENTE']}** · tolerancia del AUC: **{d['tolerancia']:g}**\n")
          print('| | en producción (v%d) | candidata |\n|---|---|---|' % d['version_referencia'])
          print(f"| fuente de los datos | {d['fuente_referencia']} | {os.environ['FUENTE']} |")
          print(f"| huella de los datos | `{d['huella_referencia']}` | `{d['huella_candidata']}` |")
          ref, cand = d['metricas_test_referencia'], d['metricas_test_candidata'] or {}
          for k in ref:
              if k in cand:
                  print(f"| {k} (test) | {ref[k]:.4f} | {cand[k]:.4f} |")
          if d['diferencia'] is not None:
              print(f"\nDiferencia del {d['metrica']}: **{d['diferencia']:+.4f}** (se rechaza si es menor que {-d['tolerancia']:+g}).")
          if d['decision'] == 'igual':
              print('\nLos datos tienen la misma huella que la versión en producción: entrenar con los mismos datos da el mismo modelo. '
                    '**Los trabajos siguientes se omiten a propósito.** Para ensayar una versión nueva, lanza el workflow con fuente = completo.')
          if d['decision'] == 'aceptada':
              print(f"\nSi se aprueba, se publicará `retencion-api:v{d['version_referencia'] + 1}-{d['huella_candidata']}`.")
          FIN

      - name: Sin novedad (los datos son los mismos)
        if: steps.comparar.outputs.decision == 'igual'
        run: |
          echo "::notice title=Sin novedad::Los datos tienen la misma huella que la versión en producción (v${{ steps.comparar.outputs.version_referencia }}): no se construye ni se publica nada."

      # Lo que necesitan los trabajos siguientes, en UNA carpeta (así el artefacto tiene siempre la misma estructura).
      - name: Empaquetar la candidata
        if: steps.comparar.outputs.decision == 'aceptada'
        run: |
          mkdir -p paquete/models paquete/reports
          cp -r models/modelo_mlflow models/modelo.joblib models/metadatos.json paquete/models/
          cp reports/metricas.json paquete/reports/
          cp decision.json paquete/
          python -m ia_mlops.produccion exportar-test --salida paquete/test.csv
          du -sh paquete

      - name: Subir la candidata (modelo, metadatos, métricas, filas de test y decisión)
        if: steps.comparar.outputs.decision == 'aceptada'
        uses: actions/upload-artifact@v4
        with:
          name: candidata
          retention-days: 1
          path: 04-Proyecto-Base/paquete

      # Va el ÚLTIMO para que el resumen ya esté escrito: aquí es donde la ejecución se pone en rojo si se rechaza.
      - name: Rechazar la versión si empeora más que la tolerancia
        if: steps.comparar.outputs.decision == 'rechazada'
        run: |
          motivo="$(python -c "import json; print(json.load(open('decision.json', encoding='utf-8'))['motivo'])")"
          echo "::error title=Versión rechazada::$motivo No se construye ni se publica nada."
          exit 1

  # ===================================================================================================================
  construir-y-probar:
    name: "2 · Construir la imagen, probarla y comparar campeón y candidata"
    needs: entrenar
    # «igual» y «rechazada» no llegan aquí: este trabajo queda omitido (gris), no fallido.
    if: needs.entrenar.outputs.decision == 'aceptada'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      ETIQUETA: ${{ needs.entrenar.outputs.etiqueta }}
      HUELLA: ${{ needs.entrenar.outputs.huella }}
      FUENTE_REFERENCIA: ${{ needs.entrenar.outputs.fuente_referencia }}
      VERSION_REFERENCIA: ${{ needs.entrenar.outputs.version_referencia }}
      VERSION_NUEVA: ${{ needs.entrenar.outputs.version_nueva }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: 04-Proyecto-Base/requirements-dev.txt

      - name: Instalar dependencias fijadas
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e . --no-deps

      - uses: actions/download-artifact@v4
        with:
          name: candidata
          path: 04-Proyecto-Base/paquete

      # El Dockerfile copia models/modelo_mlflow y models/metadatos.json: se dejan donde los espera.
      - name: Colocar el modelo de la candidata donde lo espera el Dockerfile
        run: |
          mkdir -p models reports
          cp -r paquete/models/. models/
          cp paquete/reports/metricas.json reports/
          ls models

      - name: Construir la imagen (con la etiqueta de versión dentro)
        run: |
          mkdir -p /tmp/s
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${ETIQUETA}" \
            -f deploy/docker/Dockerfile -t retencion-api:candidata .
          docker image ls retencion-api:candidata --format '{{.Repository}}:{{.Tag}}  {{.Size}}'
          test "$(docker run --rm --entrypoint id retencion-api:candidata -u)" = "10001"

      # Prueba de humo: es el contenedor que se publicaría, no otro parecido.
      - name: Probar el contenedor (/salud, /listo, /modelo y una predicción)
        run: |
          docker run -d --name api -p 8080:8080 retencion-api:candidata
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/listo > /dev/null 2>&1 && break; sleep 2; done
          curl -fsS http://127.0.0.1:8080/salud; echo
          curl -fsS http://127.0.0.1:8080/listo; echo
          curl -fsS http://127.0.0.1:8080/modelo > /tmp/modelo.json
          # la API sirve el modelo de la candidata: su huella de datos es la de la etiqueta
          python - <<'FIN'
          import json, os
          m = json.load(open('/tmp/modelo.json', encoding='utf-8'))
          assert m['huella_datos'] == os.environ['HUELLA'], f"la API sirve la huella {m['huella_datos']}, y se esperaba {os.environ['HUELLA']}"
          print('La API sirve el modelo', m['modelo'], 'con la huella', m['huella_datos'])
          FIN
          curl -fsS -X POST http://127.0.0.1:8080/predecir -H 'content-type: application/json' -d @tests/datos/cliente_ejemplo.json > /tmp/prediccion.json
          python -c "import json; p = json.load(open('/tmp/prediccion.json', encoding='utf-8')); assert 0 <= p['probabilidad'] <= 1, p; print('Predicción de ejemplo:', p['probabilidad'])"
          # la API rechaza lo que no es del contrato (aquí, el objetivo «y»)
          codigo=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/predecir -H 'content-type: application/json' \
            -d "$(python -c "import json; d=json.load(open('tests/datos/cliente_ejemplo.json')); d['y']=1; print(json.dumps(d))")")
          test "$codigo" = "422"
          test "$(docker exec api id -u)" = "10001"

      - name: Registro del contenedor (si algo falla)
        if: failure()
        run: docker logs api || true

      - name: Parar el contenedor
        if: always()
        run: docker rm -f api || true

      # Reentrena la versión de referencia en una carpeta aparte (ver «CÓMO SE COMPARA CAMPEÓN Y CANDIDATA» en la cabecera).
      - name: Datos completos · restaurar de la caché (la referencia se entrenó con ellos)
        if: needs.entrenar.outputs.fuente_referencia == 'completo'
        uses: actions/cache@v4
        with:
          path: 04-Proyecto-Base/data/raw/online_retail_ii
          key: uci-online-retail-ii-572e36277c23

      - name: Datos completos · descargar si no estaban en la caché
        if: needs.entrenar.outputs.fuente_referencia == 'completo'
        run: python -m ia_mlops.dataset descargar

      - name: Reconstruir la versión en producción (campeón) en una carpeta aparte
        run: |
          campeon="$RUNNER_TEMP/campeon"
          mkdir -p "$campeon"
          echo "campeon=$campeon" >> "$GITHUB_ENV"
          # Las variables CURSO_* desvían bases, modelos y reportes: no se pisa nada de la candidata.
          export CURSO_DB_OPERACIONAL="$campeon/operacional.db" CURSO_DB="$campeon/curso.db" CURSO_MODELOS="$campeon/models" CURSO_REPORTES="$campeon/reports"
          python -m ia_mlops.pipeline --fuente "$FUENTE_REFERENCIA" --sin-mlflow | tail -n 15
          huella_campeon="$(python -c "import json, os; print(json.load(open(os.environ['CURSO_MODELOS'] + '/metadatos.json', encoding='utf-8'))['huella_datos'])")"
          huella_referencia="$(python -c "import json; print(json.load(open('paquete/decision.json', encoding='utf-8'))['huella_referencia'])")"
          if [ "$huella_campeon" = "$huella_referencia" ]; then
            echo "campeon_ok=true" >> "$GITHUB_ENV"
            echo "Campeón reconstruido: su huella de datos ($huella_campeon) es la de models/referencia.json."
          else
            echo "campeon_ok=false" >> "$GITHUB_ENV"
            echo "::warning title=Campeón no reproducible::Reentrenar la fuente «$FUENTE_REFERENCIA» da la huella $huella_campeon y models/referencia.json dice $huella_referencia (cambió el código de preparación de datos, o la versión de pandas). Se omite la comparación por tramos."
          fi

      - name: Comparar campeón y candidata (cuántos clientes cambian de tramo)
        if: env.campeon_ok == 'true'
        run: |
          mkdir -p comparacion
          python -m ia_mlops.produccion comparar-tramos --referencia "$campeon/models" --datos paquete/test.csv \
            --salida comparacion/tramos.json --markdown comparacion/tramos.md | tee /tmp/tramos.txt

      - name: Resumen de la comparación
        if: always()
        run: |
          {
            echo "## Construir y probar · ${ETIQUETA}"
            echo
            echo "Imagen \`retencion-api:candidata\` construida y probada (/salud, /listo, /modelo con la huella \`${HUELLA}\`, una predicción y el rechazo de un campo que no es del contrato)."
            echo
            echo "### Campeón (v${VERSION_REFERENCIA}) frente a candidata (v${VERSION_NUEVA})"
            echo
            if [ -f comparacion/tramos.md ]; then
              cat comparacion/tramos.md
            else
              echo "No se pudo hacer la comparación por tramos (ver el aviso del paso «Reconstruir la versión en producción»)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar la comparación (para el pull request)
        if: env.campeon_ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: comparacion
          retention-days: 7
          path: 04-Proyecto-Base/comparacion

      - name: Guardar la imagen probada (la que se publicará, no otra reconstruida)
        run: docker save retencion-api:candidata | gzip > "$RUNNER_TEMP/imagen.tar.gz"

      - name: Subir la imagen probada
        uses: actions/upload-artifact@v4
        with:
          name: imagen
          retention-days: 1
          path: ${{ runner.temp }}/imagen.tar.gz

  # ===================================================================================================================
  publicar:
    name: "3 · Publicar en GHCR (con aprobación manual)"
    needs: [entrenar, construir-y-probar]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # El trabajo se queda en «Waiting» hasta que un revisor del environment lo aprueba (lo configura quien administra el
    # repositorio; ver CONFIGURAR-REPOSITORIO.md). Este es el ÚNICO trabajo con environment y el único con «packages: write».
    environment:
      name: produccion
    permissions:
      contents: read
      packages: write
    env:
      ETIQUETA: ${{ needs.entrenar.outputs.etiqueta }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: imagen
          path: ${{ runner.temp }}

      - name: Cargar la imagen probada
        run: gunzip -c "$RUNNER_TEMP/imagen.tar.gz" | docker load

      - name: Iniciar sesión en GHCR y publicar
        run: |
          propietario="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"    # GHCR exige minúsculas
          destino="ghcr.io/${propietario}/retencion-api:${ETIQUETA}"
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag retencion-api:candidata "$destino"
          docker push "$destino"
          {
            echo "## Publicada en GHCR"
            echo
            echo "\`${destino}\`"
            echo
            docker image inspect "$destino" --format '{{index .RepoDigests 0}}' | sed 's/^/digest: `/; s/$/`/'
            echo
            echo "Falta fusionar el pull request que abre el trabajo siguiente: hasta entonces, **la versión en producción sigue siendo la anterior** (la que dice models/referencia.json)."
            echo "Para descargarla sin iniciar sesión, el paquete debe ser público (lo cambia quien administra el repositorio)."
          } >> "$GITHUB_STEP_SUMMARY"

  # ===================================================================================================================
  referencia:
    name: "4 · Abrir el pull request que actualiza models/referencia.json"
    needs: [entrenar, construir-y-probar, publicar]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write         # solo para crear la RAMA NUEVA del pull request (nunca se empuja a develop ni a main)
      pull-requests: write    # para abrir el pull request
    env:
      ETIQUETA: ${{ needs.entrenar.outputs.etiqueta }}
      VERSION_NUEVA: ${{ needs.entrenar.outputs.version_nueva }}
      VERSION_REFERENCIA: ${{ needs.entrenar.outputs.version_referencia }}
      FUENTE: ${{ inputs.fuente }}
      BASE: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@v4
        with:
          name: candidata
          path: 04-Proyecto-Base/paquete

      - uses: actions/download-artifact@v4
        continue-on-error: true      # puede no existir (si el campeón no se pudo reconstruir): el PR sale sin la tabla de tramos
        with:
          name: comparacion
          path: 04-Proyecto-Base/comparacion

      # `crear` lee models/metadatos.json y reports/metricas.json de la candidata y escribe models/referencia.json (no necesita
      # instalar nada: solo usa la biblioteca estándar).
      # Además de la ficha, se actualiza models/historial_versiones.json (lo que lee la pestaña «Versiones» del panel): la
      # versión nueva entra como «produccion» y la que sale pasa a «anterior». Los dos archivos van en el MISMO pull request.
      - name: Escribir la referencia nueva y el historial
        run: |
          cp models/referencia.json /tmp/ficha-anterior.json
          CURSO_MODELOS="$PWD/paquete/models" CURSO_REPORTES="$PWD/paquete/reports" \
            python -m ia_mlops.produccion crear --version "$VERSION_NUEVA" --fuente "$FUENTE"
          python -m ia_mlops.produccion historial --retira /tmp/ficha-anterior.json --estado-retirada anterior
          python - <<'FIN'
          import json, os
          d = json.load(open('models/referencia.json', encoding='utf-8'))
          assert d['etiqueta_imagen'] == 'retencion-api:' + os.environ['ETIQUETA'], (d['etiqueta_imagen'], os.environ['ETIQUETA'])
          print('La ficha coincide con la imagen publicada:', d['etiqueta_imagen'])
          FIN

      - name: Rama nueva, commit y pull request
        run: |
          rama="referencia/v${VERSION_NUEVA}-${GITHUB_RUN_ID}"
          case "$rama" in main|develop|master) echo "MAL: no se empuja a $rama"; exit 1 ;; esac
          propietario="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          PROPIETARIO="$propietario" python - <<'FIN' > /tmp/cuerpo.md
          import json, os
          d = json.load(open('paquete/decision.json', encoding='utf-8'))
          print(f"Actualiza `04-Proyecto-Base/models/referencia.json` y `models/historial_versiones.json` (pestaña «Versiones» del panel): la versión **v{os.environ['VERSION_NUEVA']}** pasa a ser la de producción y la anterior queda como «anterior».\n")
          print(f"Imagen publicada en GHCR tras la aprobación del environment `produccion`: `ghcr.io/{os.environ['PROPIETARIO']}/retencion-api:{os.environ['ETIQUETA']}`.\n")
          print('| | v%s (actual) | v%s (nueva) |\n|---|---|---|' % (os.environ['VERSION_REFERENCIA'], os.environ['VERSION_NUEVA']))
          print(f"| fuente de los datos | {d['fuente_referencia']} | {os.environ['FUENTE']} |")
          print(f"| huella de los datos | `{d['huella_referencia']}` | `{d['huella_candidata']}` |")
          for k, v in d['metricas_test_referencia'].items():
              print(f"| {k} (test) | {v:.4f} | {d['metricas_test_candidata'][k]:.4f} |")
          print(f"\nDecisión de la puerta de calidad: **{d['decision']}**. {d['motivo']}\n")
          if os.path.exists('comparacion/tramos.md'):
              print('### Campeón frente a candidata\n')
              print(open('comparacion/tramos.md', encoding='utf-8').read())
          print(f"\nGenerado por la ejecución {os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}.")
          print('Al fusionar este pull request, el siguiente lote usa la versión nueva. Para volver atrás: workflow «Rollback de la versión del modelo».')
          FIN
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$rama"
          git add models/referencia.json models/historial_versiones.json
          git commit -m "Referencia del modelo: ${ETIQUETA}"
          git push origin "refs/heads/${rama}"
          url="$(gh pr create --base "$BASE" --head "$rama" --title "Referencia del modelo: ${ETIQUETA}" --body-file /tmp/cuerpo.md)"
          echo "::notice title=pull-request::${url}"
          echo "Pull request abierto: ${url}" >> "$GITHUB_STEP_SUMMARY"
